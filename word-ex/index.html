<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORD STAGE - 単語ハック -</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-screen">
        <h1>WORD STAGE</h1>
        <div class="subtitle">INPUT THE CORRECT WORD</div>

        <div id="progress-container">STAGE: <span id="current-q">1</span> / <span id="total-q">0</span></div>

        <div id="card">
            <div id="meaning-display">LOADING...</div>
            <div id="judge-overlay"></div>
        </div>

        <form id="answer-form" onsubmit="submitAnswer(event)">
            <input type="text" id="user-input" autocomplete="off" placeholder="単語を入力..." autofocus>
            <button type="submit" id="btn-submit">ENTER</button>
        </form>
    </div>

    <div id="result-screen">
        <h1>STAGE CLEAR</h1>
        <div class="subtitle">あなたのリザルト</div>
        <div class="rank-display" id="rank">--</div>
        <p class="score-text">正答率: <span id="accuracy">0</span>% (<span id="correct-count">0</span>/<span id="total-count">0</span>)</p>
        <button id="btn-retry" onclick="location.reload()">RETRY STAGE</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
