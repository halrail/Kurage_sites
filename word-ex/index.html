<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORD STAGE - 全文ハック -</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. モードセレクト画面 -->
    <div id="select-screen">
        <h1>WORD STAGE</h1>
        <div class="subtitle">SELECT YOUR MISSION</div>
        
        <div class="mode-container">
            <button class="btn-mode" id="btn-all-mode">
                <span class="mode-title">ALL WORDS STAGE</span>
                <span class="mode-desc">すべてのフレーズを完答する</span>
            </button>
            <button class="btn-mode" id="btn-fav-mode">
                <span class="mode-title">FAVORITE STAGE</span>
                <span class="mode-desc">お気に入り（★）だけで完答特訓する</span>
            </button>
        </div>
    </div>

    <!-- 2. メインのゲーム画面 -->
    <div id="game-screen" style="display: none;">
        <h1>WORD STAGE</h1>
        <div class="subtitle">TYPE THE FULL PHRASE</div>

        <div id="progress-container">STAGE: <span id="current-q">1</span> / <span id="total-q">0</span></div>

        <!-- メインカード -->
        <div id="card">
            <!-- お気に入り★ボタン -->
            <button id="btn-fav">★</button>

            <div class="display-container">
                <div id="meaning-display">LOADING...</div>
                
                <!-- 即時正答確認エリア（初期状態は非表示） -->
                <div id="review-container" style="display: none;">
                    <div class="review-line">⭕ CORRECT: <span id="review-correct"></span></div>
                    <div class="review-line">👤 YOURS: <span id="review-user"></span></div>
                </div>
            </div>
            <div id="judge-overlay"></div>
        </div>

        <form id="answer-form">
            <input type="text" id="user-input" autocomplete="off" placeholder="フレーズをまるごと入力..." autofocus>
            <!-- ボタンの文字をフェーズに合わせてJSで「ENTER」か「NEXT」に切り替えるぜ -->
            <button type="submit" id="btn-submit">ENTER</button>
        </form>
    </div>

    <!-- 3. リザルト画面 -->
    <div id="result-screen" style="display: none;">
        <h1>STAGE CLEAR</h1>
        <div class="subtitle">あなたのリザルト</div>
        <div class="rank-display" id="rank">--</div>
        <p class="score-text">正答率: <span id="accuracy">0</span>% (<span id="correct-count">0</span>/<span id="total-count">0</span>)</p>
        <button id="btn-retry" onclick="location.reload()">BACK TO TITLE</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
